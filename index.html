<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>圣光渣骑：我在异界当海王 · 原型 v0.7（第一 ~ 五章）</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#000;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;overflow:hidden}
#game{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:#000;transition:background .6s}
#bg{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:opacity .35s}#bg.out{opacity:0}
#stage{position:absolute;left:0;right:0;bottom:22%;top:6%;display:flex;justify-content:center;align-items:flex-end;gap:0}
.ch{position:relative;height:100%;transition:filter .3s,opacity .5s,transform .3s;opacity:0;animation:in .5s forwards}
.ch img{height:100%;width:100%;object-fit:contain;object-position:bottom;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.ch.dim{filter:brightness(.55)}
.ch.speak{transform:scale(1.03);z-index:2}
.ch{width:80%}.ch.duo{width:62%;margin:0 -9%}
.blushfx::after{content:"";position:absolute;left:30%;right:30%;top:9%;height:10%;background:radial-gradient(ellipse,rgba(255,80,120,.65),transparent 70%);animation:pulse 1s infinite alternate}
@keyframes in{to{opacity:1}}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
#topbar{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;color:#fff;font-size:12px;text-shadow:0 1px 3px #000;z-index:5}
#aff{background:rgba(0,0,0,.45);padding:4px 8px;border-radius:12px}
#title{position:absolute;top:38%;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:bold;letter-spacing:2px;text-shadow:0 2px 10px #000;opacity:0;pointer-events:none;z-index:6}
#title.show{animation:tt 1.8s forwards}
@keyframes tt{0%{opacity:0;transform:translateY(10px)}20%,75%{opacity:1;transform:none}100%{opacity:0}}
#box{position:absolute;left:10px;right:10px;bottom:16px;min-height:21%;background:rgba(18,12,30,.86);border:2px solid #e8c36a;border-radius:14px;padding:22px 16px 26px;color:#fff;z-index:4}
#box.sys{border-color:#6ad0ff;background:rgba(8,24,40,.9)}
#box.sys #text{color:#9fe3ff}
#name{position:absolute;top:-16px;left:14px;background:linear-gradient(90deg,#e8c36a,#c98a2a);color:#2a1600;font-weight:bold;padding:4px 14px;border-radius:10px;font-size:15px}
#name:empty{display:none}
#expr{position:absolute;top:-12px;right:14px;font-size:11px;color:#ffd9e6;background:rgba(120,30,70,.85);padding:2px 8px;border-radius:8px}
#expr:empty{display:none}
#text{font-size:16px;line-height:1.65;min-height:3.3em}
#next{position:absolute;right:12px;bottom:6px;font-size:12px;color:#e8c36a;animation:pulse .7s infinite alternate}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
.tilt{animation:tilt 1s}
@keyframes tilt{50%{transform:rotate(-6deg) scale(1.05);filter:grayscale(1)}}
.ghost #stage,.ghost #bg{filter:blur(2px) grayscale(.6)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl 1s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.particle{position:absolute;font-size:22px;pointer-events:none;z-index:7;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translateY(-160px) scale(1.4);opacity:0}}
.popup{position:absolute;left:50%;top:30%;transform:translateX(-50%);padding:8px 16px;border-radius:20px;font-weight:bold;font-size:18px;z-index:8;animation:pop 1.6s forwards;white-space:nowrap}
.popup.pos{background:#ff5c93;color:#fff}.popup.neg{background:#444;color:#9cf}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-30px)}}
#overlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;background:rgba(10,5,25,.75)}
#overlay.show{display:flex}
.cardtitle{color:#ffe08a;font-size:18px;font-weight:bold;letter-spacing:2px}
.card{width:100%;background:linear-gradient(135deg,#3a2a10,#7a5a1a);border:2px solid #ffd76a;border-radius:14px;padding:12px 14px;color:#fff;text-align:left;font-size:14px;line-height:1.5;box-shadow:0 0 18px rgba(255,200,80,.35);cursor:pointer;animation:in .4s forwards;opacity:0}
.card b{display:block;color:#ffe08a;font-size:16px;margin-bottom:4px}
.card:active{transform:scale(.97)}
.itembox{background:linear-gradient(160deg,#ffd1e3,#ff8fb8);border-radius:16px;padding:20px;text-align:center;color:#5a0a2a;width:85%;box-shadow:0 0 30px #ff8fb8}
.book{width:90px;height:120px;margin:10px auto;background:linear-gradient(135deg,#ff5c93,#b0164f);border-radius:6px 10px 10px 6px;box-shadow:inset 8px 0 0 #7a0e36,0 6px 12px rgba(0,0,0,.4);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:6px;font-weight:bold}
.btn{background:#ffd76a;color:#3a2000;border:none;border-radius:20px;padding:10px 26px;font-size:16px;font-weight:bold;cursor:pointer}
/* battle */
#battle{position:absolute;inset:0;z-index:11;display:none;background:linear-gradient(rgba(20,10,20,.45),rgba(20,10,20,.65));color:#fff}
#battle.show{display:block}
.side{position:absolute;left:0;right:0;display:flex;justify-content:space-around;padding:0 10px}
#enemies{top:12%}#allies{top:46%}
.unit{width:30%;text-align:center;position:relative}
.unit .av{width:70px;height:70px;margin:0 auto;border-radius:50%;background-size:cover;background-position:center 8%;border:3px solid #ffd76a;transition:transform .15s}
.unit.enemy .av{border-color:#a33;background:radial-gradient(circle,#555,#222);display:flex;align-items:center;justify-content:center;font-size:34px}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit .nm{font-size:12px;margin-top:4px}
.hp{height:7px;background:#300;border-radius:4px;margin:4px 6px 0;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#4f4,#9f6);transition:width .3s}
.enemy .hp i{background:linear-gradient(90deg,#f44,#f96)}
.hit{animation:shk .3s}
.atk{transform:translateY(-14px)}
.unit.enemy .atk,.unit.enemy.atk .av{transform:translateY(14px)}
.dmg{position:absolute;left:50%;top:0;color:#fff;font-weight:bold;text-shadow:0 0 4px #f00;animation:up 1s forwards;pointer-events:none}
#blog{position:absolute;left:12px;right:12px;top:70%;font-size:13px;color:#ffe;text-align:center;min-height:20px}
#energy{position:absolute;left:20px;right:20px;top:76%;height:14px;background:#222;border:2px solid #ffd76a;border-radius:8px;overflow:hidden}
#energy i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08a,#fff3c0);transition:width .3s}
#ult{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;border:none;background:radial-gradient(circle,#fff6c9,#e8b23a);font-weight:bold;font-size:15px;color:#4a2a00;box-shadow:0 0 0 rgba(255,215,106,0);cursor:pointer}
#ult:disabled{filter:grayscale(1) brightness(.5)}
#ult.ready{animation:glow .6s infinite alternate}
@keyframes glow{to{box-shadow:0 0 30px 10px #ffd76a}}
#ring{position:absolute;left:50%;bottom:calc(5% + 55px);width:300px;height:300px;margin-left:-150px;margin-bottom:-150px;border:5px solid #fff;border-radius:50%;pointer-events:none;display:none}
#ring.on{display:block}
#ring.pw{border-color:#ffd76a;box-shadow:0 0 20px #ffd76a}
#tip{position:absolute;left:10px;right:10px;top:3%;font-size:12px;background:rgba(8,24,40,.85);border:1px solid #6ad0ff;color:#9fe3ff;padding:8px;border-radius:10px;text-align:center}
#judge{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:40px;font-weight:900;color:#ffd76a;text-shadow:0 0 16px #f80;display:none}
#judge.show{display:block;animation:pop 1.6s forwards;left:50%}
#endscr{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8));color:#fff;text-align:center}
#endscr.show{display:flex;animation:in 1s forwards}
#endscr h1{font-size:30px;letter-spacing:4px;color:#ffd76a}
#endscr p{font-size:14px;color:#ccc;line-height:1.8}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3;transition:opacity 1.5s}
#fade.on{opacity:1}

.unit.enemy .av img{width:120%;height:120%;object-fit:contain;object-position:center top}
/* ===== v4 skill battle ===== */
#battle{overflow:hidden}
#bwave{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;color:#ffe08a;text-shadow:0 1px 3px #000}
#enemies{top:5%}#allies{top:44%}
.unit .av{width:64px;height:64px}
.unit.boss .av{width:86px;height:86px}
.unit.tgt .av{box-shadow:0 0 0 3px #fff,0 0 14px #ffd76a}
.unit.flash .av{animation:hf .25s}
@keyframes hf{0%{filter:brightness(3)}100%{filter:none}}
.unit.stunned .av{animation:wob 1s infinite}
@keyframes wob{50%{transform:rotate(8deg)}}
.unit .st{font-size:11px;color:#ffe066;height:14px;margin-top:2px}
.hpn{font-size:10px;color:#ddd}
.intent{font-size:11px;background:rgba(0,0,0,.6);border-radius:8px;padding:2px 6px;margin:0 auto 4px;display:inline-block;min-height:18px;color:#fff;white-space:nowrap}
.intent.warn{background:#c0182a;animation:glow .5s infinite alternate;font-weight:bold}
.dmg{font-size:18px}.dmg.crit{color:#ffd76a;font-size:22px;text-shadow:0 0 6px #f60}.dmg.heal{color:#7f7;text-shadow:0 0 6px #0a0}
#blog{top:36%;font-size:13px;background:rgba(0,0,0,.45);padding:6px 8px;border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.4}
#bhud{position:absolute;left:12px;right:12px;bottom:calc(14px + 92px);display:flex;gap:10px;align-items:center}
#holy{display:flex;gap:4px;align-items:center;font-size:11px;color:#ffe08a}
#holy b{width:16px;height:16px;border-radius:50%;border:2px solid #ffd76a;background:#332}
#holy b.on{background:radial-gradient(circle,#fff6c9,#e8b23a);box-shadow:0 0 8px #ffd76a}
#energy{position:relative;flex:1;left:auto;right:auto;top:auto;height:16px}
#energy span{position:absolute;inset:0;font-size:10px;text-align:center;color:#432;line-height:12px}
#energy.full{animation:glow .5s infinite alternate}
#skills{position:absolute;left:8px;right:8px;bottom:14px;display:flex;gap:6px;justify-content:center}
.sk{position:relative;flex:1;max-width:82px;height:84px;border-radius:16px;border:2px solid #ffd76a;background:linear-gradient(160deg,#4a3410,#1e1406);color:#ffe9b0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sk .g,.skbig .g{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#fff6c9,#e8b23a);color:#5a2a00;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}
.sk .sn{font-size:11px;margin-top:4px}
.sk.ok{box-shadow:0 0 12px rgba(255,215,106,.7)}
.sk:disabled{filter:grayscale(.9) brightness(.55)}
.sk .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;background:rgba(0,0,0,.45);border-radius:14px}
.sk .cost{position:absolute;top:-8px;right:-4px;font-size:9px;background:#e8b23a;color:#3a1a00;border-radius:6px;padding:1px 4px}
.sk-heal .g{background:radial-gradient(circle,#eaffd8,#6fcf4a)}
.sk-hammer .g{background:radial-gradient(circle,#fff,#7fb6ff)}
.sk-judge .g{background:radial-gradient(circle,#fff,#ffb347)}
.sk-ult{border-color:#fff}.sk-ult .g{background:radial-gradient(circle,#fff,#ff6fb0);color:#fff}
.skbig{display:flex;justify-content:center;margin:8px 0}.skbig .g{width:64px;height:64px;font-size:34px}
#ring{bottom:calc(14px + 42px)}
#bover{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,5,25,.7)}
#bover.show{display:flex}
.bmodal{width:84%;background:linear-gradient(160deg,#20152e,#3a2350);border:2px solid #ffd76a;border-radius:16px;padding:18px;text-align:center;color:#fff}
.bbtns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.tutt{font-size:18px;font-weight:bold;color:#ffe08a}.tutd{font-size:14px;line-height:1.6;margin-top:8px}
.lvup{font-size:34px;font-weight:900;color:#ffd76a;text-shadow:0 0 18px #f80;animation:pop2 .6s}
@keyframes pop2{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:none}}
.lvn{font-size:20px;margin:4px 0}.lvq{font-size:13px;color:#9fe3ff}.lvs{font-size:13px;margin-top:8px;line-height:1.7}
.xpbar{height:10px;background:#222;border-radius:6px;margin-top:10px;overflow:hidden}.xpbar i{display:block;height:100%;background:#7fd0ff}
#talbtn{position:absolute;top:34px;right:10px;z-index:6;background:rgba(40,20,60,.8);color:#ffe08a;border:1px solid #ffd76a;border-radius:12px;font-size:12px;padding:4px 10px}
#talbtn.glow{animation:glow .6s infinite alternate}
.talbox{width:100%;max-height:92%;overflow:auto;background:linear-gradient(160deg,#20152e,#3a2350);border:2px solid #ffd76a;border-radius:16px;padding:14px;color:#fff}
.taltitle{font-size:17px;font-weight:bold;color:#ffe08a;text-align:center}.talsub{font-size:12px;text-align:center;margin:4px 0 8px;color:#ccc}
.tal{position:relative;background:rgba(0,0,0,.3);border:1px solid #6a4a8a;border-radius:10px;padding:8px 54px 8px 10px;margin-bottom:6px}
.tal.lock{opacity:.45}.tn{font-weight:bold;font-size:14px}.tn i{font-style:normal;color:#ff7fb0;margin-left:6px}.tn em{font-style:normal;font-size:10px;color:#aaa;margin-left:6px}
.td{font-size:12px;color:#ddd;margin-top:2px}
.tadd{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:#ffd76a;font-size:22px;font-weight:900;color:#3a1a00}

.talq{min-height:18px;font-size:12px;color:#9fe3ff;text-align:center;margin:6px 0}
.talbox .btn{display:block;margin:0 auto}
/* ===== v5: title / map / mini-game / ch2 battle ===== */
#titlescr{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(rgba(0,0,0,.25),rgba(20,0,10,.85));color:#fff;text-align:center;padding:20px}

#titlescr .btn{width:80%;display:flex;flex-direction:column;align-items:center}
#titlescr .btn small{font-size:11px;font-weight:normal;opacity:.8}
#titlescr .ghostbtn{background:rgba(255,215,106,.25);color:#ffe9b0;border:1px solid #ffd76a;font-size:13px}

#endscr .btn{margin:0 0 4px}
#mapscr{position:absolute;inset:0;z-index:9;display:none;background:#000 center/cover}
#mapscr.show{display:block}
#mapinfo{position:absolute;top:34px;left:10px;right:110px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);border-radius:10px;padding:6px 10px}
#maptip{position:absolute;bottom:14px;left:10px;right:10px;font-size:12px;color:#ffe9b0;text-align:center;background:rgba(0,0,0,.55);border-radius:10px;padding:6px}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.node .ni{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:radial-gradient(circle,#fff6c9,#e8b23a);border:3px solid #fff;box-shadow:0 2px 8px #000}
.node.side .ni{width:34px;height:34px;font-size:16px;background:radial-gradient(circle,#e9f6ff,#5ab0ff)}
.node.boss .ni{border-color:#ff4d6a}
.node .nn{margin-top:2px;font-size:10px;color:#fff;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:8px;white-space:nowrap}

.node.done .ni{background:#4a4;color:#fff}
.node.next .ni,.node.open.side .ni{animation:glow .6s infinite alternate}
#mini{width:100%;height:100%;display:flex;flex-direction:column;gap:8px}
#minibar{color:#ffe08a;font-weight:bold;text-align:center;font-size:15px}
#minifield{position:relative;flex:1;border:2px solid #ffd76a;border-radius:14px;background:#000 center/cover;overflow:hidden}
.coin,.loot{position:absolute;cursor:pointer;line-height:1;filter:drop-shadow(0 2px 2px #000)}
.loot{font-size:24px;opacity:.85}.loot.got{animation:pop2 .4s;opacity:.25;pointer-events:none}
.coin.nope{animation:shk .3s}
#minifound{min-height:60px;font-size:12px;color:#9f9;line-height:1.5}
.card.gaze{background:linear-gradient(135deg,#3a1040,#8a2a7a);border-color:#ff9fe0}
.card .rate{font-style:normal;font-size:11px;color:#9fe3ff;margin-left:8px}
#allies.four .unit{width:24%}#enemies.four .unit{width:24%}
.unit.spr .av{border:none;border-radius:0;background:none;width:92px;height:92px;overflow:visible}
.unit.spr .av img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 6px #000)}
.unit.spr.boss .av{width:150px;height:150px}
#enemies.four .unit.spr .av{width:76px;height:76px}
.unit.bubble .av{box-shadow:0 0 0 6px rgba(255,230,120,.8),0 0 26px 10px #ffd76a}
.unit.wings .av{box-shadow:0 0 0 3px #fff,-26px -6px 0 -4px rgba(255,220,120,.85),26px -6px 0 -4px rgba(255,220,120,.85),0 0 30px 8px #ffb347}
#skills.two{flex-wrap:wrap;bottom:8px}

#skills.two .sk .sn{font-size:10px;margin-top:2px}
#battle.two #bhud{bottom:146px}
.sk-consec .g{background:radial-gradient(circle,#fff,#ffd23a)}.sk-bubble .g{background:radial-gradient(circle,#fff,#ffe9a0);box-shadow:0 0 8px #ffd76a}
.sk-loh .g{background:radial-gradient(circle,#fff,#9cf)}.sk-wings .g{background:radial-gradient(circle,#fff,#ff9a3a);color:#fff}.sk-struggle .g{background:radial-gradient(circle,#fff,#c8f)}
.sk-chop .g,.sk-charge .g,.sk-shout .g{background:radial-gradient(circle,#efe,#5a9a3a);color:#fff}.sk-regen .g{background:radial-gradient(circle,#fee,#c33);color:#fff}.sk-whirl .g{background:radial-gradient(circle,#fff,#3a8a2a);color:#fff}
#bover{z-index:30}
#battle{background-size:cover!important;background-position:center!important}

/* ---- ch4/ch5 ---- */

 $('#minifield').style.backgroundImage='url('+IMG['bg-vault']+')';o.classList.add('show');const tm=setInterval(()=>{left--;const t=$('#minit');if(t)t.textContent=left;if(left<=0)end();},1000);

 $('#minifield').style.backgroundImage='url('+IMG['bg-coin-trial']+')';o.classList.add('show');const tm=setInterval(()=>{left--;const t=$('#minit');if(t)t.textContent=left;if(left<=0)end();},1000);

G.flashCombo=(k,txt)=>{let d=$('#comboFx');if(!d){d=document.createElement('div');d.id='comboFx';$('#game').appendChild(d);}d.innerHTML='<img src="'+(IMG[k]||'')+'"><p>'+txt+'</p>';d.classList.add('on');sfx('ult');setTimeout(()=>d.classList.remove('on'),1100/(G.speed||1));};
function mgEnd(s,win,extra){const o=$('#overlay');setTimeout(()=>{o.classList.remove('show');o.innerHTML='';G.busy=false;G.mg=(G.mg||[]).concat([{kind:s.kind,win}]);G.queue=(extra||[]).concat(win?(s.win||[]):(s.fail||[])).concat(G.queue);writeSave({});next();},600);}
G.minigame=function(s){G.busy=true;$('#box').style.visibility='hidden';const o=$('#overlay');o.innerHTML='';o.classList.add('show');const run={nego,massage,seat,race}[s.kind];run(s,o);$('#box').style.visibility='visible';};
function nego(s,o){const need=Math.max(20,(s.need||60)-15*(P().tal.omni||0));let v=s.start||30,i=0;
 const draw=(react)=>{const r=s.rounds[i];o.innerHTML='<div class="mg"><h3>🤝 种族外交谈判 · '+s.title+'</h3><div class="sub">对象：'+s.who+'（'+s.race+'）｜好感度槽达到 <b>'+need+'</b> 即谈判成功'+(P().tal.omni?'（异种通吃 -15）':'')+'</div>'+
  '<div class="mgnpc" style="background-image:url('+(IMG[s.img]||'')+')"></div><div class="mgface">'+(react?react[0]:'😐')+'</div><div class="sub">'+(react?react[1]:s.intro)+'</div>'+
  '<div class="gauge"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i><b style="left:'+need+'%"></b></div>'+
  (r?'<div class="sub">第 '+(i+1)+'/'+s.rounds.length+' 轮：'+r.q+'</div><div class="mgcards">'+r.opts.map((op,j)=>'<div class="mgcard" data-j="'+j+'"><b>'+op.card+'</b>'+op.text+'</div>').join('')+'</div>':'')+'</div>';
  o.querySelectorAll('.mgcard').forEach(c=>c.onclick=e=>{e.stopPropagation();const op=r.opts[+c.dataset.j];v+=op.v;sfx(op.v>0?'chime':'crash');if(op.v>0)particles('💗',3);i++;
   if(i>=s.rounds.length){draw([op.v>0?'😍':'😤',op.r]);setTimeout(()=>{const win=v>=need;popup('谈判'+(win?'成功':'失败')+' '+Math.round(v)+'/'+need,win);mgEnd(s,win,[{t:'aff',who:s.who,d:win?12:3}]);},1100);}else draw([op.v>=10?'😍':op.v>0?'🙂':'😤',op.r]);});};draw();}
function massage(s,o){const beats=s.beats||8,dur=1300;const win=0.3*(1+0.2*(P().tal.hawk||0));let hit=0,n=0,cur=null;
 o.innerHTML='<div class="mg"><h3>💆 '+s.title+'</h3><div class="sub">粉色光圈收缩到和白圈重合时点击！命中 '+(s.need||5)+'/'+beats+' 即成功'+(P().tal.hawk?'（鹰之神手：判定窗口 +'+(20*P().tal.hawk)+'%）':'')+'</div><div id="mfield" style="background-image:url('+(IMG[s.img]||'')+')"></div><div class="sub" id="mstat">0/'+beats+'</div></div>';
 const f=$('#mfield');const spawn=()=>{if(n>=beats){setTimeout(()=>{const w=hit>=(s.need||5);popup((w?'舒服！':'力道不对……')+' '+hit+'/'+beats,w);mgEnd(s,w,[{t:'aff',who:s.who,d:w?10+hit:2}]);},500);return;}
  n++;const d=document.createElement('div');d.className='mspot';d.style.left=(18+Math.random()*64)+'%';d.style.top=(22+Math.random()*60)+'%';d.style.setProperty('--d',dur+'ms');d.innerHTML='<div class="ring"></div>'+['✋','💆','💗','🔥'][n%4];const t0=performance.now();let done=false;
  const fin=(ok)=>{if(done)return;done=true;d.classList.add(ok?'ok':'bad');if(ok){hit++;sfx('chime');particles(['💗','✨','😳'][hit%3],2);}else sfx('hit');$('#mstat').textContent=hit+'/'+beats+(ok?' '+pick2(s.ok):' '+pick2(s.bad));setTimeout(()=>{d.remove();spawn();},380);};
  d.onclick=e=>{e.stopPropagation();const p=(performance.now()-t0)/dur;fin(p>=1-win&&p<=1.15);};f.appendChild(d);setTimeout(()=>fin(false),dur*1.18);};spawn();}
const pick2=a=>a?a[Math.floor(Math.random()*a.length)]:'';
function seat(s,o){const a={};let sel=null;
 const draw=(msg)=>{const pos=[[50,10,'对面'],[12,50,'左手'],[88,50,'右手'],[50,72,'腿上']];const hints=(s.hints||[]).slice(0,P().tal.harem||0);
  o.innerHTML='<div class="mg"><h3>🍷 修罗场排座 · '+s.title+'</h3><div class="sub">先点女主，再点座位。满足全部醋坛规则才算成功！</div><div class="rules">'+s.rules.map(r=>'• '+r.t).join('<br>')+(hints.length?'<br><b>后宫协调提示：</b>'+hints.join('；'):'')+'</div>'+
  '<div class="seats"><div class="seat center" style="left:50%;top:42%;background-image:url('+IMG.roland+')">罗兰</div>'+pos.map((p,i)=>{const g=a[i];return '<div class="seat" data-i="'+i+'" style="left:'+p[0]+'%;top:'+p[1]+'%;'+(g?'background-image:url('+IMG[g]+')':'')+'">'+(g?NAMES[g]||g:p[2])+'</div>';}).join('')+'</div>'+
  '<div class="guests">'+s.guests.map(g=>'<div class="guest'+(sel===g?' sel':'')+(Object.values(a).includes(g)?' used':'')+'" data-g="'+g+'" style="background-image:url('+IMG[g]+')">'+(NAMES[g]||g)+'</div>').join('')+'</div><div class="sub">'+(msg||'')+'</div>'+
  (Object.keys(a).length===4?'<button class="btn" id="seatok">开席！</button>':'')+'</div>';
  o.querySelectorAll('.guest').forEach(el=>el.onclick=e=>{e.stopPropagation();sel=el.dataset.g;Object.keys(a).forEach(k=>{if(a[k]===sel)delete a[k];});draw();});
  o.querySelectorAll('.seat[data-i]').forEach(el=>el.onclick=e=>{e.stopPropagation();if(!sel){if(a[el.dataset.i]){delete a[el.dataset.i];draw();}return;}a[el.dataset.i]=sel;sel=null;sfx('beep');draw();});
  const ok=$('#seatok');if(ok)ok.onclick=e=>{e.stopPropagation();const bad=s.rules.filter(r=>!r.f(a));G.seatTries=(G.seatTries||0)+1;
   if(!bad.length){particles('💗',8);sfx('chime');popup('完美排座！',true);mgEnd(s,true);}
   else if(G.seatTries>=3){popup('醋坛子炸了 ×'+bad.length,false);sfx('crash');mgEnd(s,false);G.seatTries=0;}
   else{sfx('crash');draw('💢 '+bad.map(r=>r.angry).join(' / ')+'（还剩 '+(3-G.seatTries)+' 次）');}};};draw();}
function race(s,o){let lane=1,hits=0,love=0,left=s.time||20,fin=false;const obs=[];
 o.innerHTML='<div class="mg"><h3>🏇 '+s.title+'</h3><div class="sub">左右换道躲开障碍，吃 💗 加分！撞到 '+(s.maxHit||3)+' 次就输。</div><div id="track" style="background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.35)),url('+(IMG[s.bg]||'')+')"><div class="rider">'+s.mount+'</div></div><div class="sub" id="rstat"></div><div class="lanes"><button class="btn" id="rl">◀</button><button class="btn" id="rr">▶</button></div></div>';
 const T=$('#track'),rd=T.querySelector('.rider');const pos=()=>{rd.style.left=(lane*33.3)+'%';};pos();
 const mv=d=>{lane=Math.max(0,Math.min(2,lane+d));pos();};$('#rl').onclick=e=>{e.stopPropagation();mv(-1);};$('#rr').onclick=e=>{e.stopPropagation();mv(1);};
 T.onclick=e=>{e.stopPropagation();const r=T.getBoundingClientRect();mv(e.clientX<r.left+r.width/2?-1:1);};
 const stat=()=>{const el=$('#rstat');if(el)el.textContent='⏱ '+left+'　💥 '+hits+'/'+(s.maxHit||3)+'　💗 '+love;};stat();
 const sp=setInterval(()=>{const heart=Math.random()<0.28;const d=document.createElement('div');d.className='ob';d.textContent=heart?'💗':pick2(s.obs);const l=Math.floor(Math.random()*3);d.style.left=(l*33.3)+'%';d.style.top='-8%';T.appendChild(d);obs.push({d,l,y:-8,heart});},620);
 const mvI=setInterval(()=>{for(const b of obs.slice()){b.y+=4.2;b.d.style.top=b.y+'%';if(b.y>78&&b.y<92&&!b.done&&b.l===lane){b.done=1;b.d.remove();if(b.heart){love++;sfx('chime');}else{hits++;sfx('crash');T.classList.remove('shake');void T.offsetWidth;}stat();if(hits>=(s.maxHit||3))end();}if(b.y>100){b.d.remove();obs.splice(obs.indexOf(b),1);}}},60);
 const tm=setInterval(()=>{left--;stat();if(left<=0)end();},1000);
 function end(){if(fin)return;fin=true;clearInterval(sp);clearInterval(mvI);clearInterval(tm);const w=hits<(s.maxHit||3);popup((w?'冲线！':'摔了！')+' 💗'+love,w);mgEnd(s,w,[{t:'aff',who:s.who,d:(w?8:2)+love}]);}
 G.raceEnd=end;}

}

else showTitle();
